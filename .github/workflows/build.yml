name: Build macOS binaries of Ungoogled Chromium
on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS binaries of Ungoogled Chromium
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: true
      max-parallel: 2
    uses: ./.github/workflows/building.yml
    secrets: inherit
    with:
      arch: ${{ matrix.arch }}
      os: macos-latest

  release:
    needs: build
    name: Release macOS x86_64 fingerprint-chromium
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Resolve asset name
        id: bake
        run: |
          v=$(cat ungoogled-chromium/chromium_version.txt)
          r=$(cat ungoogled-chromium/revision.txt)
          p=$(cat revision.txt)
          echo "file_name=ungoogled-chromium_${v}-${r}.${p}_x86_64-macos.dmg" >> "$GITHUB_OUTPUT"
          echo "tag=fingerprint-${v}-${r}.${p}-x86_64" >> "$GITHUB_OUTPUT"
      - name: Get built x86-64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bake.outputs.file_name }}
      - name: List files
        run: ls -laR
      - name: Release
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          body_path: ./${{ steps.bake.outputs.file_name }}.hashes.md
          draft: false
          prerelease: true
          files: ./release_asset/${{ steps.bake.outputs.file_name }}
          name: ${{ steps.bake.outputs.tag }}
          tag_name: ${{ steps.bake.outputs.tag }}
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
